schema {
  query: Query
}

type Camera {
  driftSec: Int
  #  info
  firmwareVersion: String
  lastSeen: AWSTimestamp
  #  status
  online: Boolean!
  recording: Boolean!
  sdFreeMB: Int
  sdPresent: Boolean
  sdSizeMB: Int
  sensorModel: String
  sntpSynchronized: Boolean
  thingName: ID!
}

type CameraListPage {
  items: [Camera!]!
  nextToken: String
}

type Query {
  #  Get details about a particular camera
  getCamera(thingName: ID!): Camera
  #  Returns cameras ordered by most-recent lastSeen first (via GSI sort key + descending query)
  listCameraStatuses(limit: Int, nextToken: String): CameraListPage!
  #  Returns recordings ordered by most-recently updated first
  listRecordings(limit: Int, nextToken: String): RecordingsList!
}

type Recording {
  currentBitrate: Int
  currentFPS: Int
  errorCode: String
  errorMessage: String
  errorTimestamp: AWSTimestamp
  failedModule: String
  filename: String
  filesize: Int
  hres: Int
  lengthSeconds: Int
  status: String!
  targetBitrate: Int
  targetFPS: Int
  transactionId: ID!
  updatedAt: AWSTimestamp
  vres: Int
}

type RecordingsList {
  items: [Recording!]!
  nextToken: String
}