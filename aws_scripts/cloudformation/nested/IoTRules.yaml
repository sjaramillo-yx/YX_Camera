AWSTemplateFormatVersion: "2010-09-09"
Description: Nested stack for AWS IoT Rules + Lambda action.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  ParentStackName:
    Type: String
  DynamoTableName:
    Type: String
    Description: DynamoDB table name to write to.
  DynamoTableArn:
    Type: String
    Description: DynamoDB table ARN (for Lambda permissions).
  DynamoRoleArn:
    Type: String
    Description: IAM role ARN assumed by IoT Rules for DynamoDBv2 actions.
  UploadBucketName:
    Type: String
    Description: The bucket where files should be uploaded from the camera

Resources:
  UpdateOngoingRecordingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-update-rec-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoUpdate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoUpdate
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource:
                  - !Ref DynamoTableArn
                  - !Sub "${DynamoTableArn}/index/*"

  UpdateOngoingRecordingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ParentStackName}_updateOngoingRecording_${Environment}"
      Description: Updates the ongoing recording item in DynamoDB.
      Runtime: python3.12
      Handler: src/lambda_function.lambda_handler
      Role: !GetAtt UpdateOngoingRecordingRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoTableName
      # Local path; 'aws cloudformation package' uploads and rewrites.
      Code: lambda/UpdateOngoingRecording.zip

  IotRecordingStatusRuleInvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref UpdateOngoingRecordingFunction
      Principal: "iot.amazonaws.com"
      SourceArn: !GetAtt IotRecordingStatusRule.Arn

  IotCameraCurrentStatusRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ParentStackName}_CameraCurrentStatus_${Environment}"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Description: "Extract information about the current camera status from periodic messages"
        Sql: !Sub |
          SET 
              @serverTimeSec = floor(timestamp() / 1000),
              @timeDiff = abs(@serverTimeSec - deviceTime),
              @nowMs = timestamp(),
              @pad = concat('0000000000000', cast(@nowMs as String)),
              @lastSeenSortable = substring(@pad, length(@pad) - 13)
          
          SELECT 
              concat('Camera#', cast(thingName as String)) AS PK, 
              'status' AS SK, 
              isRecording as recording,
              isUploading as uploading,
              @nowMs AS lastSeen,
              @timeDiff AS driftSec,
            
              sdCardInfo.present AS sdPresent,
            
              CASE sdCardInfo.present
                  WHEN true THEN sdCardInfo.sizeMB
              END AS sdSizeMB,
          
              CASE sdCardInfo.present
                  WHEN true THEN sdCardInfo.freeMB
              END AS sdFreeMB
            
              'Cameras#ALL' as camerasByLastSeenPk,
              concat(@lastSeenSortable , '#', thingName) as camerasByLastSeenSk
          
          FROM '${ParentStackName}/${Environment}/cameras/status' 
          WHERE thingName = clientid() 
        Actions:
          - DynamoDBv2:
              RoleArn: !Ref DynamoRoleArn
              PutItem:
                TableName: !Ref DynamoTableName

  IotCameraHelloInfoRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ParentStackName}_CameraHelloInfo_${Environment}"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Description: "Extract information about the camera when it first boots and connects to the server"
        Sql: !Sub |
          SET
            @nowMs = timestamp(),
            @pad = concat('0000000000000', cast(@nowMs as String)),
            @updatedAtSortable = substring(@pad, length(@pad) - 13)

          SELECT
            concat('Camera#', cast(thingName as String)) AS PK,
            'info' AS SK,

            cast(thingName as String) AS thingName,
            firmwareVersion,
            videoInfo.sensorModel.name as sensorModel,
            @nowMs AS updatedAt,

            'CameraInfo#ALL' AS cameraInfoByUpdatedAtPk,
            concat(@updatedAtSortable, '#', thingName) AS cameraInfoByUpdatedAtSk

          FROM '${ParentStackName}/${Environment}/cameras/hello'
          WHERE thingName = clientid()

        Actions:
          - DynamoDBv2:
              RoleArn: !Ref DynamoRoleArn
              PutItem:
                TableName: !Ref DynamoTableName

  IotCameraHelloStatusRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ParentStackName}_CameraHelloStatus_${Environment}"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Description: "Populate the status item for a camera when receiving the hello message"
        Sql: !Sub |
          SET 
              @serverTimeSec = floor(timestamp() / 1000),
              @timeDiff = abs(@serverTimeSec - deviceTime),
              @nowMs = timestamp(),
              @pad = concat('0000000000000', cast(@nowMs as String)),
              @lastSeenSortable = substring(@pad, length(@pad) - 13)
          
          SELECT
            concat('Camera#', thingName) AS PK,
            'status' AS SK,
            
            false AS recording,
            
            @nowMs AS lastSeen,
            @timeDiff AS driftSec,
            
            sdCardInfo.present AS sdPresent,
            
            CASE sdCardInfo.present
              WHEN true THEN sdCardInfo.sizeMB
            END AS sdSizeMB,
          
            CASE sdCardInfo.present
              WHEN true THEN sdCardInfo.freeMB
            END AS sdFreeMB
            
            'Cameras#ALL' as camerasByLastSeenPk,
            concat(@lastSeenSortable , '#', thingName) as camerasByLastSeenSk
          
          FROM '${ParentStackName}/${Environment}/cameras/hello'
          WHERE thingName = clientid()
        Actions:
          - DynamoDBv2:
              RoleArn: !Ref DynamoRoleArn
              PutItem:
                TableName: !Ref DynamoTableName

  IotRecordingStatusRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ParentStackName}_RecordingStatus_${Environment}"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Description: "Extracts the recording status from messages published by the camera"
        Sql: !Sub |
          SET
            @nowMs        = timestamp(),
            @day          = floor(@nowMs / 1000 / 86400),
            @thing        = topic(4),
            @transaction  = topic(5),
            @isStart      = (status = 'STARTED'),
            @isDone       = (status = 'DONE'),
            @isOngoing    = (status = 'ONGOING'),
            @isFail       = (status = 'ERROR'),
            @pk           = concat('Camera#', @thing)
          
          SELECT
            @pk AS PK,
            concat('Rec#', @transaction) AS SK,
          
            @transaction   AS transactionId,
            status  AS status,
            @nowMs AS updatedAt,
          
            'Recs#ALL' AS allRecordingsPk,
            concat(cast(@nowMs as String), '#', @pk, '#', @transaction) AS allRecordingsSk,
          
            CASE @isStart WHEN true THEN targetBitrate      END AS targetBitrate,
            CASE @isStart WHEN true THEN targetFps          END AS targetFps,
            CASE @isStart WHEN true THEN get(resolution, 0) END AS hres,
            CASE @isStart WHEN true THEN get(resolution, 1) END AS vres,

            CASE @isOngoing WHEN true THEN 'Recs#ALL'                                                  END AS allRecordingsPk,
            CASE @isOngoing WHEN true THEN concat(cast(@nowMs as String), '#', @pk, '#', @transaction) END AS allRecordingsSk,
            CASE @isOngoing WHEN true THEN 'Ongoing#ALL'                                               END AS ongoingRecordingsPk,
            CASE @isOngoing WHEN true THEN concat(cast(@nowMs as String), '#', @pk, '#', @transaction) END AS ongoingRecordingsSk,
            CASE @isOngoing WHEN true THEN bitrate                                                     END AS currentBitrate,
            CASE @isOngoing WHEN true THEN fps                                                         END AS currentFPS,
            CASE @isOngoing WHEN true THEN recordedSeconds                                             END AS lengthSec,
            
            CASE @isDone WHEN true THEN filename        END AS filename,
            CASE @isDone WHEN true THEN filesize        END AS filesize,
            CASE @isDone WHEN true THEN recordedSeconds END AS lengthSec,
            
            CASE @isFail WHEN true THEN errorCode END AS errorCode,
            CASE @isFail WHEN true THEN errorMessage END AS errorMessage,
            CASE @isFail WHEN true THEN errorOrigin END AS failedModule,
            CASE @isFail WHEN true THEN timestamp END AS errorTimestamp
          
          FROM '${ParentStackName}/${Environment}/recordings/+/+/status'
          WHERE
              @thing = clientid()
        Actions:
          - Lambda:
              FunctionArn: !GetAtt UpdateOngoingRecordingFunction.Arn

#========================== Upload orchestrator ==========================
  UploadOrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-upload-orchestrator-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UploadOrchestratorAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDB (your camera data table)
              - Sid: DdbAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:Query
                Resource:
                  - !Ref DynamoTableArn
                  - !Sub "${DynamoTableArn}/index/*"
        - PolicyName: S3MultipartForUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Create + Complete require PutObject on the OBJECT key
              - Sid: PutObjectForMPU
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${UploadBucketName}/*"

              # Upload individual parts
              - Sid: UploadPart
                Effect: Allow
                Action:
                  - s3:UploadPart
                Resource:
                  - !Sub "arn:aws:s3:::${UploadBucketName}/*"

              # Abort unfinished uploads
              - Sid: AbortMPU
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub "arn:aws:s3:::${UploadBucketName}/*"

              # (Optional) List parts / in-progress uploads for diagnostics
              - Sid: ListForDiagnostics
                Effect: Allow
                Action:
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !Sub "arn:aws:s3:::${UploadBucketName}"
              # Publish commands back to the device over IoT
              - Sid: IotPublish
                Effect: Allow
                Action: iot:Publish
                Resource:
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/${ParentStackName}/${Environment}/uploads/*/*/commands"
        - PolicyName: IotDescribeEndpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowDescribeEndpoint
                Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: "*"     # DescribeEndpoint doesn't support resource ARNs

  UploadOrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ParentStackName}_UploadOrchestrator_${Environment}"
      Description: Drives S3 multipart uploads from device STATUS via IoT.
      Runtime: python3.12
      Handler: src/lambda_function.lambda_handler
      Role: !GetAtt UploadOrchestratorRole.Arn
      Timeout: 20
      MemorySize: 384
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoTableName
          UPLOAD_BUCKET: !Ref UploadBucketName
          PRESIGN_TTL_SECS: "900"
          TOPIC_PREFIX: !Sub "${ParentStackName}/${Environment}"
      # Packaged artifact (same convention as your other Lambda)
      Code: lambda/UploadOrchestrator.zip
  
  IotUploadStatusRuleInvokePerm:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref UploadOrchestratorFunction
      Principal: "iot.amazonaws.com"
      SourceArn: !GetAtt IotUploadStatusRule.Arn

  IotUploadStatusRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ParentStackName}_UploadStatus_${Environment}"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Description: "Consumes upload STATUS from devices and invokes the orchestrator"
        Sql: !Sub |
          SET
            @nowMs     = timestamp(),
            @thing     = topic(4),
            @uploadId  = topic(5),
            @pk        = concat('Camera#', @thing),
            @skMeta    = concat('Up#', @uploadId)

          SELECT
            @pk           AS PK,
            @skMeta       AS SK,
            @thing        AS thingName,
            @uploadId     AS uploadId,

            op            AS op,
            recording_id  AS recording_id,
            status        AS deviceStatus,
            part_number   AS partNumber,
            etag          AS etag,
            parts         AS parts,
            error_code    AS errorCode,
            error_message AS errorMessage,

            @nowMs        AS receivedAt
          FROM '${ParentStackName}/${Environment}/uploads/+/+/status'
          WHERE @thing = clientid()
        Actions:
          - Lambda:
              FunctionArn: !GetAtt UploadOrchestratorFunction.Arn


Outputs:
  UpdateOngoingRecordingLambdaArn:
    Value: !GetAtt UpdateOngoingRecordingFunction.Arn
  UploadOrchestratorLambdaArn:
    Value: !GetAtt UploadOrchestratorFunction.Arn