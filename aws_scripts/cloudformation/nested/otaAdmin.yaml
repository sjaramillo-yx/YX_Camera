AWSTemplateFormatVersion: "2010-09-09"
Description: Admin OTA creator Lambda (CreateOTAUpdate for many ThingNames), using shared camera-data bucket prefixes.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]

  ParentStackName:
    Type: String

  CameraDataBucketName:
    Type: String

  OtaServiceRoleArn:
    Type: String

  SigningProfileName:
    Type: String

  UnsignedPrefix:
    Type: String
    Default: firmware/unsigned/

  SignedPrefix:
    Type: String
    Default: firmware/signed/

Resources:
  OtaAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-ota-admin-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OtaAdmin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:            
              # Read firmware binaries/manifests from S3
              - Sid: ReadOtaArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${CameraDataBucketName}/firmware/*/unsigned/*"

              - Sid: ReadSignedArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${CameraDataBucketName}/firmware/*/signed/*"


              - Sid: CreateOta
                Effect: Allow
                Action:
                  - iot:GetOTAUpdate
                  - iot:CreateOTAUpdate
                  - iot:DescribeOTAUpdate
                Resource: "*"
              - Sid: PassOtaRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref OtaServiceRoleArn
              - Sid: Caller
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

  OtaAdminFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ParentStackName}_ota_admin_${Environment}"
      Role: !GetAtt OtaAdminRole.Arn
      Runtime: python3.12
      Handler: src/lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          CAMERA_BUCKET: !Ref CameraDataBucketName
          OTA_SERVICE_ROLE_ARN: !Ref OtaServiceRoleArn
          SIGNING_PROFILE_NAME: !Ref SigningProfileName
          UNSIGNED_PREFIX: !Ref UnsignedPrefix
          SIGNED_PREFIX: !Ref SignedPrefix
      Code: lambda/OtaAdmin.zip

Outputs:
  OtaAdminLambdaArn:
    Value: !GetAtt OtaAdminFunction.Arn
  OtaAdminLambdaName:
    Value: !Ref OtaAdminFunction
