AWSTemplateFormatVersion: "2010-09-09"
Description: AppSync GraphQL API (JavaScript resolvers) backed by DynamoDB.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  ParentStackName:
    Type: String

  DynamoTableName:
    Type: String
    Description: DynamoDB table name used by AppSync resolvers.

  DynamoTableArn:
    Type: String
    Description: DynamoDB table ARN (used for IAM policies).

  AuthType:
    Type: String
    Default: AWS_IAM
    AllowedValues:
      - AWS_IAM
      - API_KEY
    Description: Primary AppSync auth mode.

Conditions:
  UseApiKeyAuth: !Equals [!Ref AuthType, API_KEY]

Resources:
  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "${ParentStackName}-camera-db-api-${Environment}"
      AuthenticationType: !Ref AuthType
      XrayEnabled: true

  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Definition: |
        schema {
          query: Query
        }

        type Camera {
          driftSec: Int
          #  info
          firmwareVersion: String
          lastSeen: AWSTimestamp
          #  status
          online: Boolean!
          recording: Boolean!
          uploading: Boolean!
          sdFreeMB: Int
          sdPresent: Boolean
          sdSizeMB: Int
          sensorModel: String
          sntpSynchronized: Boolean
          thingName: ID!
        }

        type CameraListPage {
          items: [Camera!]!
          nextToken: String
        }

        type Recording {
          currentBitrate: Int
          currentFPS: Int
          errorCode: String
          errorMessage: String
          errorTimestamp: AWSTimestamp
          failedModule: String
          filename: String
          filesize: Int
          hres: Int
          lengthSeconds: Int
          status: String!
          targetBitrate: Int
          targetFPS: Int
          transactionId: ID!
          updatedAt: AWSTimestamp
          vres: Int
        }

        type RecordingsList {
          items: [Recording!]!
          nextToken: String
        }

        type Upload {
          thingName: ID!
          uploadId: ID!
          transactionId: ID!
          status: String!
          partSize: Int
          totalParts: Int
          partsUploaded: Int!
          partsLeft: Int!
          nextPart: Int
          startedAt: AWSTimestamp
          updatedAt: AWSTimestamp
          completedAt: AWSTimestamp
          s3UploadId: String
          key: String!
        }

        type UploadListPage {
          items: [Upload!]!
          nextToken: String
        }

        type Query {
          #  Get details about a particular camera
          getCamera(thingName: ID!): Camera
          #  Returns cameras ordered by most-recent lastSeen first (via GSI sort key + descending query)
          listCameraStatuses(limit: Int, nextToken: String): CameraListPage!
          #  Returns recordings ordered by most-recently updated first
          listRecordings(limit: Int, nextToken: String): RecordingsList!
          # Get details about a particular upload
          getUpload(thingName: ID!, uploadId: ID!): Upload
          # Returns uploads for a particular camera
          listUploadsByCamera(thingName: ID!, limit: Int, nextToken: String): UploadListPage!
        }



  # Only created when AuthType == API_KEY
  GraphQLApiKey:
    Type: AWS::AppSync::ApiKey
    Condition: UseApiKeyAuth
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Description: !Sub "${Environment} API key"

  AppSyncDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-Appsync-ddb-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoRead
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Ref DynamoTableArn
                  - !Sub "${DynamoTableArn}/index/*"

  CameraTableDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: camera_data_source
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoRole.Arn
      DynamoDBConfig:
        AwsRegion: !Ref AWS::Region
        TableName: !Ref DynamoTableName

  GetCameraInfoFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: !Sub ${ParentStackName}_GetCameraInfo_${Environment}
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from "@aws-appsync/utils";

        export function request(ctx) {
          const thingName = ctx.stash.thingName;
          return {
            operation: "GetItem",
            key: util.dynamodb.toMapValues({
              PK: `Camera#${thingName}`,
              SK: "info",
            }),
          };
        }

        export function response(ctx) {
          ctx.stash.infoItem = ctx.result ?? null;
          return ctx.result;
        }

  GetCameraStatusFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: !Sub ${ParentStackName}_GetCameraStatus_${Environment}
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from "@aws-appsync/utils";

        export function request(ctx) {
          const thingName = ctx.stash.thingName;
          return {
            operation: "GetItem",
            key: util.dynamodb.toMapValues({
              PK: `Camera#${thingName}`,
              SK: "status",
            }),
          };
        }

        export function response(ctx) {
          ctx.stash.statusItem = ctx.result ?? null;
          return ctx.result;
        }

  GetCameraResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GraphQLSchema
      - GetCameraInfoFunction
      - GetCameraStatusFunction
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getCamera
      Kind: PIPELINE
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        /**
        * Starts the resolver execution
        * @param {import('@aws-appsync/utils').Context} ctx the context
        * @returns {*} the return value sent to the first AppSync function
        */
        export function request(ctx) {
          ctx.stash.thingName = ctx.args.thingName;
          return {};
        }


        /**
        * Returns the resolver result
        * @param {import('@aws-appsync/utils').Context} ctx the context
        * @returns {*} the return value of the last AppSync function response handler
        */
        export function response(ctx) {
          const nowMs = util.time.nowEpochMilliSeconds();
          const argThingName = ctx.stash.thingName;

          const status = ctx.stash.statusItem || null;
          const info = ctx.stash.infoItem || null;

          // If neither exists, return null
          if (!status && !info) return null;

          // Merge with status having precedence over info
          const merged = { ...(info ?? {}), ...(status ?? {}) };

          // Derive thingName from PK if needed
          let derivedThingName = merged.thingName;

          if (!derivedThingName) {
            const pk = merged.PK || status?.PK || info?.PK;
            if (typeof pk === "string" && pk.startsWith("Camera#")) {
              derivedThingName = pk.slice("Camera#".length);
            }
          }

          const thingName = derivedThingName ?? argThingName;
          const online = merged.lastSeen != null ? (nowMs - merged.lastSeen) <= 30_000 : false;
          const sntpSynchronized = merged.driftSec < 31;

          return {
            thingName,

            // status fields
            online,
            recording: merged.recording ?? false,
            uploading: merged.uploading ?? false,
            lastSeen: merged.lastSeen,
            driftSec: merged.driftSec,
            sntpSynchronized,

            sdPresent: merged.sdPresent,
            sdSizeMB: merged.sdSizeMB,
            sdFreeMB: merged.sdFreeMB,

            // info fields
            firmwareVersion: merged.firmwareVersion,
            sensorModel: merged.sensorModel,
          };
        }
      PipelineConfig:
        Functions:
          - !GetAtt GetCameraInfoFunction.FunctionId
          - !GetAtt GetCameraStatusFunction.FunctionId

  ListCameraStatusesResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listCameraStatuses
      Kind: UNIT
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from "@aws-appsync/utils";

        export function request(ctx) {
          const args = ctx.args ?? ctx.arguments ?? {};
          const limit = args.limit ?? 50;
          const nextToken = args.nextToken;

          return {
            operation: "Query",
            index: "cameras-by-last-seen",
            query: {
              expression: "#pk = :pk",
              expressionNames: { "#pk": "camerasByLastSeenPk" },
              expressionValues: util.dynamodb.toMapValues({ ":pk": "Cameras#ALL" }),
            },
            limit,
            nextToken,
            scanIndexForward: false, // newest first
          };
        }

        export function response(ctx) {
          const { items = [], nextToken = null } = ctx.result ?? {};

          const nowMs = util.time.nowEpochMilliSeconds();

          const mapped = items.map((it) => {
            // Check if source includes thingName
            let thingName = it.thingName;
            // If not, derive it from camerasByLastSeenSk
            if (!thingName && typeof it.camerasByLastSeenSk === "string") {
              const i = it.camerasByLastSeenSk.indexOf("#");
              if (i >= 0) thingName = it.camerasByLastSeenSk.slice(i + 1);
            }
            // If camerasByLastSeenPk is not a string, obtain it from the table PK
            if (!thingName && typeof it.PK === "string" && it.PK.startsWith("Camera#")) {
              thingName = it.PK.slice("Camera#".length);
            }
            const online = it.lastSeen != null ? (nowMs - it.lastSeen) <= 30_000 : false;
            const sntpSynchronized = it.driftSec < 31;

            return {
              thingName,                    // must be non-null for ID!
              online,
              recording: it.recording ?? false,
              uploading: it.uploading ?? false,
              lastSeen: it.lastSeen,
              driftSec: it.driftSec,
              sntpSynchronized,
              sdPresent: it.sdPresent,
              sdSizeMB: it.sdSizeMB,
              sdFreeMB: it.sdFreeMB
            };
          });

          return { items: mapped, nextToken };
        }

  ListRecordingsResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listRecordings
      Kind: UNIT
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from "@aws-appsync/utils";

        export function request(ctx) {
          const args = ctx.args ?? ctx.arguments ?? {};
          const limit = args.limit ?? 50;
          const nextToken = args.nextToken;

          return {
            operation: "Query",
            index: "all-recordings",
            query: {
              expression: "#pk = :pk",
              expressionNames: { "#pk": "allRecordingsPk" },
              expressionValues: util.dynamodb.toMapValues({ ":pk": "Recs#ALL" }),
            },
            limit,
            nextToken,
            scanIndexForward: false, // newest first
          };
        }

        export function response(ctx) {
          const { items = [], nextToken = null } = ctx.result ?? {};

          const mapped = items.map((it) => ({
            thingName: it.PK.slice("Camera#".length),
            transactionId: it.transactionId,
            status: it.status ?? "UNKNOWN",

            hres: it.hres,
            vres: it.vres,

            targetFPS: it.targetFps,
            targetBitrate: it.targetBitrate,

            currentFPS: it.currentFPS,
            currentBitrate: it.currentBitrate,

            lengthSeconds: it.lengthSeconds ?? it.duration ?? it.recordedSeconds ?? it.lengthSec,

            filename: it.filename,
            filesize: it.filesize,

            updatedAt: it.updatedAt,

            errorCode: it.errorCode,
            errorMessage: it.errorMessage,
            failedModule: it.failedModule,
            errorTimestamp: it.errorTimestamp,
          }));

          return { items: mapped, nextToken };
        }

  GetUploadMetaFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: !Sub ${ParentStackName}_GetUploadMeta_${Environment}
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: "1.0.0" }
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          const { thingName, uploadId } = ctx.stash;
          return {
            operation: "GetItem",
            key: util.dynamodb.toMapValues({
              PK: `Camera#${thingName}`,
              SK: `Up#${uploadId}`,
            }),
          };
        }
        export function response(ctx) {
          ctx.stash.meta = ctx.result ?? null;
          return ctx.result;
        }

  CountUploadPartsFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: !Sub ${ParentStackName}_CountUploadParts_${Environment}
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: "1.0.0" }
      Code: |
        import { util } from "@aws-appsync/utils";
        // NOTE: Select: COUNT returns the number of matching items, which here means
        //       the number of UPLOADED PARTS (rows with SK = 'Up#<uploadId>#Part#<N>').
        export function request(ctx) {
          const { thingName, uploadId } = ctx.stash;
          return {
            operation: "Query",
            query: {
              expression: "#pk = :pk AND begins_with(#sk, :sk)",
              expressionNames: { "#pk": "PK", "#sk": "SK" },
              expressionValues: util.dynamodb.toMapValues({
                ":pk": `Camera#${thingName}`,
                ":sk": `Up#${uploadId}#Part#`,
              }),
            },
            select: "COUNT",   // COUNT == number of uploaded parts
          };
        }
        export function response(ctx) {
          const count = ctx.result?.count ?? 0;
          ctx.stash.partsUploaded = count;  // explicit: uploaded parts count
          return count;
        }

  ListUploadMetasForCameraFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - GraphQLSchema
      - CameraTableDataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: !Sub ${ParentStackName}_ListUploadMetas_${Environment}
      DataSourceName: !GetAtt CameraTableDataSource.Name
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: "1.0.0" }
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          const { thingName, limit = 50, nextToken } = ctx.stash ?? {};
          if (!thingName) util.error("Missing thingName in stash", "BadRequest");
          return {
            operation: "Query",
            query: {
              expression: "#pk = :pk AND begins_with(#sk, :sk)",
              expressionNames: { "#pk": "PK", "#sk": "SK" },
              expressionValues: util.dynamodb.toMapValues({
                ":pk": `Camera#${thingName}`,
                ":sk": "Up#",
              }),
            },
            filter: {
              expression: "attribute_exists(#s3u)",
              expressionNames: { "#s3u": "s3UploadId" },
            },
            limit,
            nextToken,
            scanIndexForward: false,
          };
        }
        export function response(ctx) {
          const { items = [], nextToken = null } = ctx.result ?? {};
          ctx.stash.list = items;
          return { items, nextToken };
        }

  GetUploadResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GraphQLSchema
      - GetUploadMetaFunction
      - CountUploadPartsFunction
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getUpload
      Kind: PIPELINE
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: "1.0.0" }
      Code: |
        import { util } from "@aws-appsync/utils";
        export function request(ctx) {
          ctx.stash.thingName = ctx.args.thingName;
          ctx.stash.uploadId = ctx.args.uploadId;
          return {};
        }
        export function response(ctx) {
          const { thingName, uploadId, meta, partsUploaded = 0 } = ctx.stash;
          if (!meta) return null;
          const status = meta.status ?? "UNKNOWN";
          const totalParts = meta.totalParts ?? 1;
          const partSize = meta.partSize ?? null;
          const nextPart = meta.nextPart ?? null;
          const uploaded = typeof meta.partsDone === "number" ? meta.partsDone : partsUploaded;
          const partsLeft = Math.max(0, (totalParts ?? 0) - (uploaded ?? 0));
          return {
            thingName,
            uploadId,
            status,
            partSize,
            totalParts,
            partsUploaded: uploaded, // explicit: uploaded parts count
            partsLeft,
            nextPart,
            startedAt: meta.startedAt,
            updatedAt: meta.updatedAt,
            completedAt: meta.completedAt,
            s3UploadId: meta.s3UploadId,
            key: `${thingName}/${uploadId}.mp4`,
          };
        }
      PipelineConfig:
        Functions:
          - !GetAtt GetUploadMetaFunction.FunctionId
          - !GetAtt CountUploadPartsFunction.FunctionId

  ListUploadsByCameraResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - GraphQLSchema
      - ListUploadMetasForCameraFunction
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listUploadsByCamera
      Kind: PIPELINE
      Runtime: { Name: APPSYNC_JS, RuntimeVersion: "1.0.0" }
      Code: |
        import { util } from "@aws-appsync/utils";

        export function request(ctx) {
          const { thingName, limit = 50, nextToken } = ctx.arguments ?? {};
          if (!thingName) util.error("Missing thingName", "BadRequest");

          ctx.stash.thingName = thingName;
          ctx.stash.limit = limit;
          ctx.stash.nextToken = nextToken;
          return {};
        }
        export function response(ctx) {
          const thingName = ctx.stash.thingName;
          const { items = [], nextToken = null } = ctx.prev.result ?? {};
          const mapped = items.map(it => {
            const uploadId = it.uploadId || (typeof it.SK === "string" ? it.SK.slice("Up#".length) : null);
            const totalParts = it.totalParts ?? 1;
            const uploaded = typeof it.partsDone === "number" ? it.partsDone : 0;
            const partsLeft = Math.max(0, totalParts - uploaded);
            return {
              thingName,
              uploadId,
              status: it.status ?? "UNKNOWN",
              partSize: it.partSize,
              totalParts,
              partsUploaded: uploaded,  // explicit: uploaded parts count
              partsLeft,
              nextPart: it.nextPart,
              startedAt: it.startedAt,
              updatedAt: it.updatedAt,
              completedAt: it.completedAt,
              s3UploadId: it.s3UploadId,
              key: `${thingName}/${uploadId}.bin`,
            };
          });
          return { items: mapped, nextToken };
        }
      PipelineConfig:
        Functions:
          - !GetAtt ListUploadMetasForCameraFunction.FunctionId


  # Dedicated role created by this stack for managing this AppSync API (separate from deployer roles).
  # RoleName is omitted by default to avoid name collisions; set AppSyncManagerRoleName if you must pin it.
  AppSyncManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ParentStackName}-appsync-manager-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Account admins can assume (useful for break-glass / debugging)
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
          # Deployer roles can assume (CI/CD)
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/yx-deployer-devtest"
            Action: "sts:AssumeRole"


  AppSyncManagerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ParentStackName}-appsync-manage-${Environment}"
      Roles:
        - !Ref AppSyncManagerRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListApisConsoleFriendly
            Effect: Allow
            Action:
              - appsync:ListGraphqlApis
              - appsync:ListApiKeys
              - appsync:ListDataSources
              - appsync:ListFunctions
              - appsync:ListResolvers
              - appsync:ListTypes
              - appsync:ListTagsForResource
            Resource: "*"

          - Sid: ManageThisAppSyncApi
            Effect: Allow
            Action:
              - appsync:GetGraphqlApi
              - appsync:UpdateGraphqlApi
              - appsync:DeleteGraphqlApi

              - appsync:GetIntrospectionSchema
              - appsync:SetIntrospectionSchema

              - appsync:GetSchemaCreationStatus
              - appsync:StartSchemaCreation

              - appsync:GetType
              - appsync:CreateType
              - appsync:UpdateType
              - appsync:DeleteType

              - appsync:GetDataSource
              - appsync:CreateDataSource
              - appsync:UpdateDataSource
              - appsync:DeleteDataSource

              - appsync:GetFunction
              - appsync:CreateFunction
              - appsync:UpdateFunction
              - appsync:DeleteFunction

              - appsync:GetResolver
              - appsync:CreateResolver
              - appsync:UpdateResolver
              - appsync:DeleteResolver

              - appsync:CreateApiKey
              - appsync:DeleteApiKey
              - appsync:UpdateApiKey

              - appsync:TagResource
              - appsync:UntagResource
            Resource:
              - !Sub
                - "arn:aws:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ApiId}"
                - { ApiId: !GetAtt GraphQLApi.ApiId }
              - !Sub
                - "arn:aws:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ApiId}/*"
                - { ApiId: !GetAtt GraphQLApi.ApiId }

          - Sid: ExecuteGraphQLOnThisApi
            Effect: Allow
            Action: appsync:GraphQL
            Resource: !Sub
              - "arn:aws:appsync:${AWS::Region}:${AWS::AccountId}:apis/${ApiId}/types/*/fields/*"
              - { ApiId: !GetAtt GraphQLApi.ApiId }

          - Sid: PassOnlyAppSyncServiceRolesIfNeeded
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
            Condition:
              StringEquals:
                iam:PassedToService: appsync.amazonaws.com
          
          - Sid: ApiKeyManagementGlobal
            Effect: Allow
            Action:
              - appsync:CreateApiKey
              - appsync:UpdateApiKey
              - appsync:DeleteApiKey
            Resource: "*"


    
Outputs:
  ApiId:
    Value: !GetAtt GraphQLApi.ApiId

  GraphQLUrl:
    Value: !GetAtt GraphQLApi.GraphQLUrl

  ApiKey:
    Condition: UseApiKeyAuth
    Value: !GetAtt GraphQLApiKey.ApiKey

  ApiNameOut:
    Value: !Sub "${ParentStackName}-camera-db-api-${Environment}"
  AppSyncManagerRoleNameOut:
    Value: !Ref AppSyncManagerRole

  AppSyncManagerRoleArn:
    Value: !GetAtt AppSyncManagerRole.Arn