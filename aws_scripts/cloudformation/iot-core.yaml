AWSTemplateFormatVersion: '2010-09-09'
Description: IoT Core fleet provisioning setup for YX Camera devices.

Parameters:
  CameraPolicyName:
    Type: String
    Default: cameraPolicy
  ProvisioningPolicyName:
    Type: String
    Default: provisioningPolicy
  ProvisioningTemplateName:
    Type: String
    Default: cameraTemplate
  ProvisioningRoleName:
    Type: String
    Default: yx-IoTProvisioningRole

Resources:
  CameraPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Ref CameraPolicyName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: '*'
          - Effect: Allow
            Action: iot:Publish
            Resource: arn:aws:iot:*:*:topic/yx/cameras/hello
          - Effect: Allow
            Action: iot:Publish
            Resource: arn:aws:iot:*:*:topic/yx/cameras/status
          - Effect: Allow
            Action: iot:Subscribe
            Resource: arn:aws:iot:::topicfilter/$aws/things/${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Receive
            Resource: arn:aws:iot:::topic/$aws/things/${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Publish
            Resource: arn:aws:iot:::topic/$aws/things/${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource: arn:aws:iot:*:*:topicfilter/yx/recordings/${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Receive
            Resource: arn:aws:iot:*:*:topic/yx/recordings/${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Publish
            Resource: arn:aws:iot:*:*:topic/yx/recordings/${iot:Connection.Thing.ThingName}/*

  ProvisioningPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Ref ProvisioningPolicyName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: '*'
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Receive
            Resource:
              - arn:aws:iot:*:*:topic/$aws/certificates/create/json
              - arn:aws:iot:*:*:topic/$aws/certificates/create/json/accepted
              - arn:aws:iot:*:*:topic/$aws/certificates/create/json/rejected
              - !Sub arn:aws:iot:*:*:topic/$aws/provisioning-templates/${ProvisioningTemplateName}/provision/json
              - !Sub arn:aws:iot:*:*:topic/$aws/provisioning-templates/${ProvisioningTemplateName}/provision/json/accepted
              - !Sub arn:aws:iot:*:*:topic/$aws/provisioning-templates/${ProvisioningTemplateName}/provision/json/rejected
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - arn:aws:iot:*:*:topicfilter/$aws/certificates/create/json/accepted
              - arn:aws:iot:*:*:topicfilter/$aws/certificates/create/json/rejected
              - !Sub arn:aws:iot:*:*:topicfilter/$aws/provisioning-templates/${ProvisioningTemplateName}/provision/json/accepted
              - !Sub arn:aws:iot:*:*:topicfilter/$aws/provisioning-templates/${ProvisioningTemplateName}/provision/json/rejected

  ProvisioningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ProvisioningRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSIoTThingsRegistration

  ProvisioningTemplate:
    Type: AWS::IoT::ProvisioningTemplate
    Properties:
      Enabled: true
      TemplateName: !Ref ProvisioningTemplateName
      ProvisioningRoleArn: !GetAtt ProvisioningRole.Arn
      TemplateBody: !Sub |
        {
          "Parameters": {
            "SerialNumber": {
              "Type": "String"
            },
            "AWS::IoT::Certificate::Id": {
              "Type": "String"
            }
          },
          "Resources": {
            "policy_cameraPolicy": {
              "Type": "AWS::IoT::Policy",
              "Properties": {
                "PolicyName": "${CameraPolicyName}"
              }
            },
            "certificate": {
              "Type": "AWS::IoT::Certificate",
              "Properties": {
                "CertificateId": {
                  "Ref": "AWS::IoT::Certificate::Id"
                },
                "Status": "Active",
                "ThingPrincipalType": "EXCLUSIVE_THING"
              }
            },
            "thing": {
              "Type": "AWS::IoT::Thing",
              "OverrideSettings": {
                "AttributePayload": "MERGE",
                "ThingGroups": "DO_NOTHING",
                "ThingTypeName": "REPLACE"
              },
              "Properties": {
                "AttributePayload": {},
                "ThingGroups": [],
                "ThingName": {
                  "Fn::Join": [
                    "",
                    [
                      "VueltaCam_",
                      {
                        "Ref": "SerialNumber"
                      }
                    ]
                  ]
                }
              }
            }
          }
        }

Outputs:
  ProvisioningRoleArn:
    Value: !GetAtt ProvisioningRole.Arn
  ProvisioningTemplateName:
    Value: !Ref ProvisioningTemplate
  CameraPolicyName:
    Value: !Ref CameraPolicy
  ProvisioningPolicyName:
    Value: !Ref ProvisioningPolicy
