AWSTemplateFormatVersion: "2010-09-09"
Description: VueltaCam AWS stack with nested stacks for each resource.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  
  LowercaseStackName:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  DynamoStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/dynamoDB.yaml
      Parameters:
        ParentStackName: !Select [0, !Split ["-", !Ref "AWS::StackName"]]  # foo
        Environment: !Ref Environment

  IoTRulesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [
      DynamoStack,
      CameraDataBucket
    ]
    Properties:
      TemplateURL: nested/IoTRules.yaml
      Parameters:
        ParentStackName: !Select [0, !Split ["-", !Ref "AWS::StackName"]]  # foo
        Environment: !Ref Environment
        DynamoTableName: !GetAtt DynamoStack.Outputs.TableName
        DynamoTableArn: !GetAtt DynamoStack.Outputs.TableArn
        DynamoRoleArn: !GetAtt DynamoStack.Outputs.IoTRuleRoleArn
        UploadBucketName: !Ref CameraDataBucket
  
  IoTCoreStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/IoTCore.yaml
      Parameters:
        ParentStackName: !Select [0, !Split ["-", !Ref "AWS::StackName"]]  # foo
        Environment: !Ref Environment
  
  CameraDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${LowercaseStackName}-${Environment}-${AWS::AccountId}-${AWS::Region}-camera-data"

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  
  AppSyncStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: DynamoStack
    Properties:
      TemplateURL: nested/appSync.yaml
      Parameters:
        ParentStackName: !Select [0, !Split ["-", !Ref "AWS::StackName"]]  # foo
        Environment: !Ref Environment
        DynamoTableName: !GetAtt DynamoStack.Outputs.TableName
        DynamoTableArn: !GetAtt DynamoStack.Outputs.TableArn
        AuthType: API_KEY # optional (AWS_IAM or API_KEY)
        AppSyncManagerRoleName: !If [IsProd, "yx-deployer-prod", "yx-deployer-devtest"]


Outputs:
  RootStackName:
    Value: !Ref AWS::StackName
  DynamoTableName:
    Value: !GetAtt DynamoStack.Outputs.TableName
  IotRuleRoleArn:
    Value: !GetAtt DynamoStack.Outputs.IoTRuleRoleArn
  UpdateOngoingRecordingLambdaArn:
    Value: !GetAtt IoTRulesStack.Outputs.UpdateOngoingRecordingLambdaArn
  CameraDataBucketName:
    Value: !Ref CameraDataBucket
  CameraDataBucketArn:
    Value: !GetAtt CameraDataBucket.Arn