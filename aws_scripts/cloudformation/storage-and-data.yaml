AWSTemplateFormatVersion: '2010-09-09'
Description: Core storage for YX Camera (S3 bucket, DynamoDB table, and IoT rule role)

Resources:
  CameraDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CameraDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CameraDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${CameraDataBucket.Arn}'
              - !Sub '${CameraDataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CameraDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: allRecordingsPk
          AttributeType: S
        - AttributeName: allRecordingsSk
          AttributeType: S
        - AttributeName: ongoingRecordingsPk
          AttributeType: S
        - AttributeName: ongoingRecordingsSk
          AttributeType: S
        - AttributeName: camerasByLastSeenPk
          AttributeType: S
        - AttributeName: camerasByLastSeenSk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: all-recordings
          KeySchema:
            - AttributeName: allRecordingsPk
              KeyType: HASH
            - AttributeName: allRecordingsSk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ongoing-recordings
          KeySchema:
            - AttributeName: ongoingRecordingsPk
              KeyType: HASH
            - AttributeName: ongoingRecordingsSk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: cameras-by-last-seen
          KeySchema:
            - AttributeName: camerasByLastSeenPk
              KeyType: HASH
            - AttributeName: camerasByLastSeenSk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IotRuleDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoWrite
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt CameraDataTable.Arn
                  - !Sub "${CameraDataTable.Arn}/index/*"

Outputs:
  BucketName:
    Value: !Ref CameraDataBucket
    Description: Name of the S3 bucket storing firmware, logs, and videos.
  TableName:
    Value: !Ref CameraDataTable
    Description: DynamoDB table name for camera data.
  TableArn:
    Value: !GetAtt CameraDataTable.Arn
    Description: ARN of the DynamoDB table.
  IotRuleRoleArn:
    Value: !GetAtt IotRuleDynamoRole.Arn
    Description: Role ARN IoT Rules should assume when writing to DynamoDB.